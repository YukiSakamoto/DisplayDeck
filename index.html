<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js ESM</title>
  <style>body { margin: 0; }</style>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    /* 画面全体を左右に分割するコンテナ */
    #container {
        display: flex;
        flex-direction: row;
        height: 100vh;
    }
    /* 3D表示エリア - 画面右側 */
    #three-area {
        flex: 1 1 0;
        height: 100vh;
        background-color: #f0f0f0;
        position: relative; /* three.jsのcanvasを配置するため */
        order: 1;
    }
    /* コントロールエリア - 画面左側 */
    #control-area {
        flex: 0 0 50%;
        max-width: 40%;
        height: 100vh;
        overflow-y: auto; /* テーブルが大きくなってもスクロール可能に */
        padding: 10px;
        box-sizing: border-box;
        background-color: #e0e0e0;
        order: 0;
    }
    .collapsed {
      display: none;
    }
    #control-area.collapsed {
      display: none;
      flex: 0;
      width: 0;
      padding: 0;
      margin: 0;
    }
    #toggle-control {
        align-self: flex-start;
        flex: 0 0 auto;
        margin: 8px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
    }
    input[type="number"] {
        width: 50px;
    }
  </style>
</head>
<body>
  <!--H1>
	Ardea
  </H1-->
  <div id="container">
    <div id="three-area">
    </div>
    <button id="toggle-control">Toggle</button>
    <div id="control-area">
      <h2>object control</h2>
      <p id = "server-health">Server: (checking...)</p>
      <table id="object-control-table">
        <thead>
          <tr>
            <th>object</th>
            <th>display</th>
            <th>left and right</th>
            <th>index</th>
            <th>width</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

<script>
  const controlArea=document.getElementById('control-area');
  const toggleBtn = document.getElementById('toggle-control');
  toggleBtn.addEventListener('click', () => {
    controlArea.classList.toggle('collapsed');
    window.dispatchEvent(new Event('resize'));
  });
</script>
</html>
