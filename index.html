<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js ESM</title>
  <style>body { margin: 0; }</style>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    /* 画面全体を左右に分割するコンテナ */
    #container {
        display: flex;
        flex-direction: row;
        height: 100vh;
    }
    /* 3D表示エリア - 画面右側 */
    #three-area {
        flex: 1 1 0;
        height: 100vh;
        background-color: #f0f0f0;
        position: relative; /* three.jsのcanvasを配置するため */
        order: 1;
    }
    /* コントロールエリア - 画面左側 */
    #control-area {
        flex: 0 0 50%;
        max-width: 40%;
        height: 100vh;
        overflow-y: auto; /* テーブルが大きくなってもスクロール可能に */
        padding: 10px;
        box-sizing: border-box;
        background-color: #e0e0e0;
        order: 0;
    }
    #control-area.collapsed {
      flex: 0 0 36px;
      overflow: hidden;
      padding: 4px 0;
    }
    /* 下部レイアウト */
    #container.bottom-layout {
      flex-direction: column;
    }
    #container.bottom-layout #three-area {
      flex: 1 1 0;
      min-height: 0;        /* キャンバスの高さに引っ張られて縮まなくなるのを防ぐ */
      overflow: hidden;     /* THREE.jsキャンバスがはみ出してコントロール領域を覆うのを防ぐ */
      width: 100%;
      height: auto;
      order: 0;
    }
    #container.bottom-layout #control-area {
      flex: 0 0 50vh;       /* % だと column flex で不安定なので vh を直指定 */
      max-width: none;
      width: 100%;
      height: 50vh;
      overflow-y: auto;
      order: 1;
    }
    #container.bottom-layout #control-area.collapsed {
      flex: 0 0 36px;
      height: 36px;
    }
    /* CSS2DRenderer ステータスラベル */
    .object-label {
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
    }
    .object-label.status-idle    { color: #69f0ae; }
    .object-label.status-running { color: #ffab40; }
    .object-label.status-error   { color: #ff5252; }

    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
    }
    input[type="number"] {
        width: 50px;
    }
  </style>
</head>
<body>
  <!--H1>
	Ardea
  </H1-->
  <div id="container">
    <div id="three-area"></div>
    <div id="control-area"></div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
